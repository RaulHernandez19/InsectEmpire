<!-- src/app/components/insect-list/insect-list.component.html -->
<main class="p-6 h-auto pt-20 text-center">
  <div class="absolute pl-4 ">
    <button
      (click)="goBackAction()"
      class="flex items-center bg-gray-700 text-white
       px-3 py-2 rounded hover:bg-gray-800 transition-colors"
    >
    <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="none"  stroke="currentColor"  stroke-width="2"  stroke-linecap="round"  stroke-linejoin="round"  class="icon icon-tabler icons-tabler-outline icon-tabler-arrow-back-up"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 14l-4 -4l4 -4" /><path d="M5 10h11a4 4 0 1 1 0 8h-1" /></svg>
      <span class="ml-2">Regresar</span>
    </button>


  </div>

  <h1 class="text-white text-3xl font-bold leading-tight mx-auto">
    {{taxonName}}
  </h1>


  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 p-4">

  </div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
    <!-- Mostrar placeholders si está cargando -->
    <ng-container *ngIf="loading">
      <div *ngFor="let placeholder of placeholders" class="bg-gray-300 dark:bg-gray-700 animate-pulse h-48 w-full rounded-md"></div>
    </ng-container>

    <!-- Mostrar insectos reales cuando carga -->
    <ng-container *ngIf="!loading">
      <app-insect-card *ngFor="let insect of insects" [insect]="insect"></app-insect-card>
    </ng-container>
  </div>

<div class="flex justify-center gap-4 mt-4 items-center">
  <!-- Botón Anterior -->
  <button
    (click)="previousPage()"
    [disabled]="offset === 0"
    class="bg-yellow-500 text-dark px-1 py-1 sm:px-4 sm:py-2 rounded disabled:bg-gray-300 hover:bg-yellow-600 transition-colors"
  >
  <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="currentColor"  class="icon icon-tabler icons-tabler-filled icon-tabler-caret-left"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M13.883 5.007l.058 -.005h.118l.058 .005l.06 .009l.052 .01l.108 .032l.067 .027l.132 .07l.09 .065l.081 .073l.083 .094l.054 .077l.054 .096l.017 .036l.027 .067l.032 .108l.01 .053l.01 .06l.004 .057l.002 .059v12c0 .852 -.986 1.297 -1.623 .783l-.084 -.076l-6 -6a1 1 0 0 1 -.083 -1.32l.083 -.094l6 -6l.094 -.083l.077 -.054l.096 -.054l.036 -.017l.067 -.027l.108 -.032l.053 -.01l.06 -.01z" /></svg> <!-- Icono de flecha izquierda -->
  </button>

  <!-- Números de página -->
  <div class="flex gap-2">
    <button
      *ngFor="let page of visiblePages"
      (click)="goToPage(page)"
      [class.bg-yellow-500]="page === currentPage"
      [class.text-dark]="page === currentPage"
      [class.bg-gray-200]="page !== currentPage"
      class="px-2 py-1 rounded  hover:bg-yellow-500 transition-colors sm:px-3 sm:py-2 "
    >
      {{ page }}
    </button>
  </div>

  <!-- Botón Siguiente -->
  <button
    (click)="nextPage()"
    class="bg-yellow-500 text-dark px-1 py-1 sm:px-4 sm:py-2 rounded hover:bg-yellow-600 transition-colors"
  >
  <svg  xmlns="http://www.w3.org/2000/svg"  width="24"  height="24"  viewBox="0 0 24 24"  fill="currentColor"  class="icon icon-tabler icons-tabler-filled icon-tabler-caret-right"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M9 6c0 -.852 .986 -1.297 1.623 -.783l.084 .076l6 6a1 1 0 0 1 .083 1.32l-.083 .094l-6 6l-.094 .083l-.077 .054l-.096 .054l-.036 .017l-.067 .027l-.108 .032l-.053 .01l-.06 .01l-.057 .004l-.059 .002l-.059 -.002l-.058 -.005l-.06 -.009l-.052 -.01l-.108 -.032l-.067 -.027l-.132 -.07l-.09 -.065l-.081 -.073l-.083 -.094l-.054 -.077l-.054 -.096l-.017 -.036l-.027 -.067l-.032 -.108l-.01 -.053l-.01 -.06l-.004 -.057l-.002 -12.059z" /></svg> <!-- Icono de flecha derecha -->
  </button>
</div>
</main>
